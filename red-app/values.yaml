# RED App - Default Values
# Override these in your own values.yaml file

replicaCount: 1

image:
  repository: public.ecr.aws/t3v3f1b2/red-app
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: red.your-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: red-tls
  #    hosts:
  #      - red.your-domain.com

# Required environment variables
env:
  DATABASE_URL: ""
  LICENSE_SERVER_URL: ""
  LICENSE_KEY: ""
  NODE_ENV: production
  PORT: "5000"
  SESSION_SECRET: ""
  JWT_SECRET: ""
  ALLOWED_ORIGINS: ""
  APP_URL: ""

# Optional environment variables
optionalEnv: {}
  # RATE_LIMIT_MAX: "100"
  # SMTP_HOST: ""
  # SMTP_PORT: "465"
  # SMTP_USER: ""
  # SMTP_PASSWORD_BASE64: ""
  # SMTP_FROM: ""

# Use existing secret for sensitive env vars instead of plaintext
# When set, the secret must contain keys: DATABASE_URL, SESSION_SECRET, JWT_SECRET, LICENSE_KEY
existingSecret: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 40
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Persistent volume for generated reports (scheduled Excel exports)
persistence:
  reports:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

# Bitnami PostgreSQL subchart
postgresql:
  enabled: true
  auth:
    database: red_production
    username: red_user
    password: ""
    postgresPassword: ""
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    configuration: |
      max_connections = 200
      shared_buffers = 256MB
      effective_cache_size = 1GB
      work_mem = 16MB
      maintenance_work_mem = 128MB
      checkpoint_completion_target = 0.9
      wal_buffers = 16MB
      default_statistics_target = 100
