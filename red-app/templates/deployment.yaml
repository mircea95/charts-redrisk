apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "red-app.fullname" . }}
  labels:
    {{- include "red-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "red-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "red-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "red-app.serviceAccountName" . }}
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgresql.image | quote }}
          command: ['sh', '-c', 'until pg_isready -h {{ include "red-app.fullname" . }}-postgresql -p 5432 -U {{ .Values.postgresql.auth.username }}; do echo "Waiting for PostgreSQL..."; sleep 2; done']
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: DATABASE_URL
              {{- if .Values.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_URL
              {{- else }}
              value: {{ include "red-app.databaseUrl" . | quote }}
              {{- end }}
            - name: LICENSE_SERVER_URL
              value: {{ .Values.env.LICENSE_SERVER_URL | quote }}
            - name: LICENSE_KEY
              {{- if .Values.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: LICENSE_KEY
              {{- else }}
              value: {{ .Values.env.LICENSE_KEY | quote }}
              {{- end }}
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.env.PORT | default "5000" | quote }}
            - name: SESSION_SECRET
              {{- if .Values.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SESSION_SECRET
              {{- else }}
              value: {{ .Values.env.SESSION_SECRET | quote }}
              {{- end }}
            - name: JWT_SECRET
              {{- if .Values.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: JWT_SECRET
              {{- else }}
              value: {{ .Values.env.JWT_SECRET | quote }}
              {{- end }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.env.ALLOWED_ORIGINS | quote }}
            - name: APP_URL
              value: {{ .Values.env.APP_URL | quote }}
            {{- range $key, $value := .Values.optionalEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.reports.enabled }}
          volumeMounts:
            - name: reports
              mountPath: /app/reports
          {{- end }}
      {{- if .Values.persistence.reports.enabled }}
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: {{ include "red-app.fullname" . }}-reports
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
