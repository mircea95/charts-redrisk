{{- if .Values.persistence.reports.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "red-app.fullname" . }}-reports
  labels:
    {{- include "red-app.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.reports.accessModes | nindent 4 }}
  {{- if .Values.persistence.reports.storageClass }}
  storageClassName: {{ .Values.persistence.reports.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.reports.size }}
{{- end }}
{{- if .Values.persistence.uploads.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "red-app.fullname" . }}-uploads
  labels:
    {{- include "red-app.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.uploads.accessModes | nindent 4 }}
  {{- if .Values.persistence.uploads.storageClass }}
  storageClassName: {{ .Values.persistence.uploads.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.uploads.size }}
{{- end }}
